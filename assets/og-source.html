<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>EchoHex / OG card source</title>
<style>
@font-face{font-family:"Geist";src:url("fonts/geist-latin.woff2") format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"Geist Mono";src:url("fonts/geist-mono-latin.woff2") format("woff2");font-weight:100 900;font-display:block}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#050505;color:#f2f2ee;font-family:"Geist","Microsoft YaHei",sans-serif}
body{position:relative;padding:54px 64px;display:flex;flex-direction:column;justify-content:space-between}
body:before{content:"";position:absolute;inset:0;background-image:linear-gradient(to right,rgba(242,242,238,.06) 1px,transparent 1px),linear-gradient(to bottom,rgba(242,242,238,.06) 1px,transparent 1px);background-size:72px 72px;mask-image:radial-gradient(ellipse 80% 80% at 40% 45%,#000 10%,transparent 85%);-webkit-mask-image:radial-gradient(ellipse 80% 80% at 40% 45%,#000 10%,transparent 85%)}
body:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 18% 18%,rgba(255,255,255,.08),transparent 38%);pointer-events:none}
.top,.bottom,.center{position:relative;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between;font-family:"Geist Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#9b9b94}
.brand{display:flex;align-items:center;gap:12px;color:#f2f2ee;font-family:"Geist",sans-serif;font-size:15px;font-weight:600;letter-spacing:.22em}
.brand svg{width:26px;height:26px}
.center{margin-top:14px}
.kicker{font-family:"Geist Mono",monospace;font-size:12px;letter-spacing:.16em;color:#9b9b94;text-transform:uppercase}
h1{margin:12px 0 0 -4px;font-size:172px;line-height:.8;font-weight:650;letter-spacing:-.075em;text-transform:uppercase;white-space:nowrap}
h1 span{color:#6f6f69}
.role{margin-top:24px;font-family:"Geist Mono",monospace;font-size:13px;letter-spacing:.18em;color:#c8c8c2;text-transform:uppercase}
.bottom{display:flex;align-items:flex-end;justify-content:space-between;padding-top:18px;border-top:1px solid rgba(242,242,238,.18);font-family:"Geist Mono",monospace;font-size:10px;letter-spacing:.12em;color:#8a8a84;text-transform:uppercase}
.bottom b{color:#f2f2ee;font-weight:400}
</style>
</head>
<body>
  <div class="top">
    <span class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.5 28 9.3v13.4L16 29.5 4 22.7V9.3Z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M9 16h4.1l2.1-5.1 2.6 10.2 2.2-5.1H23" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      ECHOHEX
    </span>
    <span>SIGNAL / 001</span>
  </div>

  <div class="center">
    <p class="kicker">KEEP HOPE 2901 / 开发者</p>
    <h1>ECHO<span>HEX</span></h1>
    <p class="role">[ 黑白 / 终端 / 简洁 ]</p>
  </div>

  <div class="bottom">
    <span>YUJIANXI666.GITHUB.IO</span>
    <span><b>INFINITE PROGRESS</b> / 2026</span>
  </div>
</body>
</html>
